spring:
  application:
    name: aiwebgen

  datasource:
    url: jdbc:postgresql://localhost:5432/aiwebgen
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:

    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.7
jwt:
  secret: ${JWT_SECRET}